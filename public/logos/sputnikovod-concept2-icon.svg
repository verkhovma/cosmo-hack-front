<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="sputnikovod-c2-t sphinx-c2-d">
  <title id="sputnikovod-c2-t">Спутниковод — тройка спутников</title>
  <desc id="sphinx-c2-d">Three grey satellite nodes on scarlet orbit arcs</desc>
  <defs>
    <style>
      .arc { fill: none; stroke: #EF3443; stroke-width: 6; stroke-linecap: round; }
      .node { fill: #545B62; stroke: #fff; stroke-width: 3; }
    </style>
  </defs>
  <g id="icon">
    <circle cx="48" cy="48" r="34" fill="none" stroke="#EF3443" stroke-width="6" stroke-dasharray="140 74" stroke-linecap="round" transform="rotate(-40 48 48)" />
    <circle class="node" cx="48" cy="14" r="9" />
    <circle class="node" cx="77" cy="63" r="9" />
    <circle class="node" cx="19" cy="63" r="9" />
    <circle cx="48" cy="48" r="6" fill="#545B62" />
  </g>
</svg>
